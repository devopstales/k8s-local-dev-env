repositories:
- name: devopstales
  url: https://devopstales.github.io/helm-charts
- name: metrics-server
  url: https://kubernetes-sigs.github.io/metrics-server/

helmDefaults:
  wait: true

releases:
- name: kubedash
  namespace: dashboard-system
#  chart: devopstales/kubedash
  chart: /data/git/kubedash/deploy/helm/
  labels:
    environment: simple
  values:
    - kubedash-values.yaml
- name: kubedash
  namespace: dashboard-system
  chart: devopstales/kubedash
  labels:
    environment: monitoring
  values:
    - kubedash-m-values.yaml
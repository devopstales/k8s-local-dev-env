repositories:
- name: kyverno
  url: https://helm.pomerium.io

releases:
- name: kyverno
  namespace: kyverno-system
  chart: kyverno/kyverno
  labels:
    environment: simple
  values:
   - kyverno-values.yaml
- name: kyverno
  namespace: ingress-system
  chart: kyverno-system

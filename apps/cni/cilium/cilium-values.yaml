MTU: 1300
externalIPs:
  enabled: true
hostPort:
  enabled: true
hubble:
  frontend:
    server:
      ipv6:
        enabled: false
  metrics:
    enabled:
    - dns
    - drop
    - tcp
    - flow:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
    - port-distribution
    - icmp
    - kafka:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction;sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
    - policy:sourceContext=app|workload-name|pod|reserved-identity;destinationContext=app|workload-name|pod|dns|reserved-identity;labelsContext=source_namespace,destination_namespace
    - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
  relay:
    enabled: true
  ui:
    enabled: true
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: ca-issuer
        ingress.pomerium.io/allow_public_unauthenticated_access: 'true'
      className: default
      enabled: true
      hosts:
      - cilium.kdev.intra
      tls:
      - hosts:
        - cilium.kdev.intra
        secretName: hubble-ingress-tls
    replicas: 1
ipam:
  mode: kubernetes
ipv4:
  enabled: true
ipv6:
  enabled: false
k8sServiceHost: kdev-control-plane
k8sServicePort: '6443'
kubeProxyReplacement: true
l2announcements:
  enabled: true
loadBalancer:
  l7:
    backend: envoy
nodePort:
  enabled: true
operator:
  replicas: 1
pmtuDiscovery:
  enabled: true
rollOutCiliumPods: true

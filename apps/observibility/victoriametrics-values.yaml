tenant: "0"

grafana:
  defaultDashboardsTimezone: CET
  adminPassword: admin
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: ca-issuer
      hajimari.io/enable: "true" 
      hajimari.io/group: "Monitoring"
      hajimari.io/appName: "Grafana"
      hajimari.io/icon: "mdi:finance"
    hosts:
      - grafana.kdev.intra
    paths:
    - /
    pathType: ImplementationSpecific
    tls:
    - secretName: grafana-tls-secret
      hosts:
      - grafana.kdev.intra
  sidecar:
    datasources:
      enabled: true
      initDatasources: true
    dashboards:
      provider:
        name: default
        orgid: 1
      folder: /var/lib/grafana/dashboards
      defaultFolderName: default
      enabled: true
      multicluster: false
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/default
  dashboards: {}
  plugins:
    - grafana-oncall-app
    - grafana-piechart-panel
    - hamedkarbasi93-nodegraphapi-datasource
    - marcusolsson-json-datasource
    - marcusolsson-dynamictext-panel
    - isovalent-hubbleprocessancestry-panel
    - isovalent-hubble-datasource
    - victoriametrics-metrics-datasource
    - victoriametrics-logs-datasource
  "grafana.ini":
    feature_toggles:
      enable: externalServiceAccounts
      accessControlOnCall: 'false'
    server:
      root_url: "https://grafana.kdev.intra"
      domain: "grafana.kdev.intra"
    sso.generic_oauth:
      enabled: true
      name: "SSO"
      allow_sign_up: true
      scopes: "openid profile email"
      auth_url: "https://sso.kdev.intra/oauth/v2/authorize"
      token_url: "https://sso.kdev.intra/oauth/v2/token"
      api_url: "https://sso.kdev.intra/oidc/v1/userinfo"
      role_attribute_path: >
        contains(roles[*], 'admin') && 'Admin' ||
        contains(roles[*], 'backend') && 'Editor' ||
        contains(roles[*], 'frontend') && 'Editor' ||
        contains(roles[*], 'data') && 'Editor' ||
        'Viewer'
  extraVolumes:
    - name: "plugin-provisioning-oncall"
      configMap:
        name: "grafana-provisioning"
        key: "plugin-oncall.yaml"
    - name: "rbac-provisioning"
      configMap:
        name: "grafana-provisioning"
        key: "rbac.yaml"
  extraVolumeMounts:
    - name: "plugin-provisioning-oncall"
      mountPath: "/etc/grafana/provisioning/plugins/oncall.yaml"
      subPath: "plugin-oncall.yaml"
    - name: "rbac-provisioning"
      mountPath: "/etc/grafana/provisioning/access-control/rbac.yaml"
      subPath: "rbac.yaml"

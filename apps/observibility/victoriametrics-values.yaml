defaultDashboards:
  enabled: false
  grafanaOperator:
      enabled: false
      spec:
        instanceSelector:
          matchLabels:
            dashboards: "grafana"
        allowCrossNamespaceImport: true
  dashboards:
    victoriametrics-vmalert:
      enabled: false
    victoriametrics-operator:
      enabled: false

grafanaOperatorDashboardsFormat:
  enabled: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  allowCrossNamespaceImport: true
defaultRules:
  rule:
    spec:
      annotations:
        dashboard: "https://grafana.kdev.intra/dashboards"


vmagent:
  externalLabels:
    cluster: "kdev"

kubeEtcd:
  enabled: true
  service:
    enabled: true
    port: 2379
    targetPort: 2379
    selector:
      component: kube-controller-manager # instead of using hardcoded IP endpoints,
      # this is a trick borrowed from from https://github.com/siderolabs/talos/discussions/7214#discussioncomment-10255876 
      # which only works if/because etcd is deployed on the same nodes where the rest
      # of the api server (notably kube-controller-manager) are deployed. Adjust if that's 
      # not how your cluster is set up.
  # vmScrape here is synonymous with serviceMonitor in kube-prometheus
  vmScrape:
    spec:
      jobLabel: jobLabel
      namespaceSelector:
        matchNames: [kube-system]
      endpoints:
        - port: http-metrics
          scheme: https
          tlsConfig: # caFile, certFile, and keyFile from Neil's post
            ca:
              secret: # can reference the secret directly instead of needing
                      # to add it somewhere else
                name: etcd-secrets
                key: ca.crt
            cert:
              secret:
                name: etcd-secrets
                key: server.crt
            keySecret:
              name: etcd-secrets
              key: server.key

vmsingle:
  spec:
    retentionPeriod: "1d" # Minimal retention, for tests only
    replicaCount: 1
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    extraArgs:
      maxLabelsPerTimeseries: "50"
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: ca-issuer
      ingress.pomerium.io/allow_public_unauthenticated_access: 'true'
      nginx.ingress.kubernetes.io/auth-signin: http://oauth.kdev.intra/oauth2/start
      # That's what will be used in REAL LIFE
      #nginx.ingress.kubernetes.io/auth-url: http://oauth.kdev.intra/oauth2/auth
      # but because of https://github.com/kubernetes/ingress-nginx/issues/3665
      nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy-ingress.ingress-system.svc.cluster.local/oauth2/auth
      nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-User,X-Auth-Request-Email
      nginx.ingress.kubernetes.io/proxy-buffer-size: 512k
    hosts:
      - victoriametrics.kdev.intra
    paths:
    - /
    pathType: ImplementationSpecific
    tls:
    - secretName: victoriametrics-tls-secret
      hosts:
      - victoriametrics.kdev.intra

vmalert:
    annotations: {}
    enabled: true


repositories:
- name: jetstack
  url: https://charts.jetstack.io

releases:
- name: cert-manager
  namespace: ingress-system
  chart: jetstack/cert-manager
  labels:
    environment: simple
  values:
   - cert_manager-values.yaml
- name: cert-manager
  namespace: ingress-system
  chart: jetstack/cert-manager
  labels:
    environment: simple-ga
  values:
   - cert_manager-ga-values.yaml
- name: cert-manager
  namespace: ingress-system
  chart: jetstack/cert-manager
  labels:
    environment: monitoring
  values:
   - cert_manager-m-values.yaml
- name: cert-manager
  namespace: ingress-system
  chart: jetstack/cert-manager
  labels:
    environment: monitoring-ga
  values:
   - cert_manager-ga-m-values.yaml
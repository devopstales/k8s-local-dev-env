config:
  pluginsDir: "/build/plugins"
  oidc:
    clientID: "k8s"
    clientSecret: "1Y1BDvwweUiVL89VFePBe5zSMIpI54NM"
    issuerURL: "https://sso.kdev.intra"
    scopes: "openid profile email"

ingress:
  enabled: true
  className: default
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer
    ingress.pomerium.io/allow_public_unauthenticated_access: 'true'
  hosts:
    - host: headlamp.kdev.intra
      paths:
        - path: /
          type: ImplementationSpecific
  tls:
    - secretName: shiwa-tls
      hosts:
        - headlamp.kdev.intra

podSecurityContext:
  fsGroup: 101
  runAsGroup: 101
  runAsNonRoot: true
  runAsUser: 101

initContainers:
  - command:
      - /bin/sh
      - -c
      - id && mkdir -pv /build/plugins && ls -laF /build && cp -r /plugins/* /build/plugins/ && ls -laF /build/plugins
    image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:latest
    imagePullPolicy: Always
    name: headlamp-plugins
    volumeMounts:
      - mountPath: /build/plugins
        name: headlamp-plugins

persistentVolumeClaim:
  accessModes:
    - ReadWriteOnce
  enabled: true
  size: 10Gi

volumeMounts:
  - mountPath: /build/plugins
    name: headlamp-plugins

volumes:
  - name: headlamp-plugins
    persistentVolumeClaim:
      claimName: headlamp

ingress:
  main:
    enabled: true
    className: default
    annotations:
      cert-manager.io/cluster-issuer: ca-issuer
      ingress.pomerium.io/allow_public_unauthenticated_access: 'true'
      nginx.ingress.kubernetes.io/auth-signin: http://oauth.kdev.intra/oauth2/start
      # That's what will be used in REAL LIFE
      #nginx.ingress.kubernetes.io/auth-url: http://oauth.kdev.intra/oauth2/auth
      # but because of https://github.com/kubernetes/ingress-nginx/issues/3665
      nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy-ingress.ingress-system.svc.cluster.local/oauth2/auth
      nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-User,X-Auth-Request-Email
      nginx.ingress.kubernetes.io/proxy-buffer-size: 512k

    hosts:
      - host: devops.kdev.intra
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: devops-tls-secret
        hosts:
          - devops.kdev.intra
persistence:
  data:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
hajimari:
  namespaceSelector:
      matchNames:
        - kube-system
        - auth-system
        - monitoring-system
        - dashboard-system
  showGreeting: false
  showAppUrls: false
  showAppGroups: true
  showBookmarks: false
  showBookmarkGroups: false
  showGlobalBookmarks: false
  showSearch: false
  defaultSearchProvider: Google
  searchProviders:
    - name: Google
      token: g
      icon: simple-icons:google
      searchUrl: https://www.google.com/search?q={query}
      url: https://www.google.com
  customApps:
    - group: Monitoring
      apps:
        - name: VictoriaMetrics
          url: 'https://victoriametrics.kdev.intra/vmui/?#/?g0.expr=up&g0.tab=1'
          icon: 'mdi:chart-multiple'
          info: VictoriaMetrics UP Apps
    - group: Monitoring
      apps:
        - name: vmalert
          url: 'https://victoriametrics.kdev.intra/vmalert/'
          icon: 'mdi:chart-multiple'
          info: VictoriaMetrics Alerts
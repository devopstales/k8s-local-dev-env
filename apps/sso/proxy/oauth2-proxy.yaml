repositories:
- name: oauth2-proxy
  url: https://oauth2-proxy.github.io/manifests

releases:
- name: oauth2-proxy-ingress
  namespace: ingress-system
  chart: oauth2-proxy/oauth2-proxy
  labels:
    server: dex
  values:
   - oauth2-proxy-dex-values.yaml
- name: oauth2-proxy-ingress
  namespace: ingress-system
  chart: oauth2-proxy/oauth2-proxy
  labels:
    server: keycloak
  values:
   - oauth2-proxy-keycloak-values.yaml
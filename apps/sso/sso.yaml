repositories:
- name: bitnami
  url: https://charts.bitnami.com/bitnami
- name: epamedp
  url: https://epam.github.io/edp-helm-charts/stable

releases:
- name: keycloak-operator
  namespace: auth-system
  chart: epamedp/keycloak-operator
- name: keycloak
  namespace: auth-system
  chart: bitnami/keycloak
  labels:
    environment: simple
  values:
   - sso-values.yaml

repositories:
- name: bitnami
  url: https://charts.bitnami.com/bitnami

releases:
- name: keycloak
  namespace: auth-system
  chart: bitnami/keycloak
  labels:
    environment: simple
  values:
   - sso-values.yaml
- name: keycloak
  namespace: auth-system
  chart: bitnami/keycloak
  labels:
    environment: monitoring
  values:
   - sso-m-values.yaml
- name: keycloak
  namespace: auth-system
  chart: bitnami/keycloak
  labels:
    environment: export
  values:
   - sso-export-values.yaml
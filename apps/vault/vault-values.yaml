ui:
  enabled: true
server:
  dev:
    enabled: true
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: ca-issuer
      ingress.pomerium.io/allow_public_unauthenticated_access: "true"
    hosts:
      - host: vault.kdev.intra
        paths: []
    tls:
      - secretName: vault-ingress-tls
        hosts:
          - vault.kdev.intra

  standalone:
    enabled: "true"
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/vault/data"
      }

      #storage "etcd" {
      #  address  = "http://localhost:2379"
      #  etcd_api = "v3"
      #}


